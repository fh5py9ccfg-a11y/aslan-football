services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aslan:aslan@postgres:5432/aslan
      REDIS_URL: redis://redis:6379/0
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-this-production-secret}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-local-v1}
      JWT_ISSUER: ${JWT_ISSUER:-aslan-ozaslan}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aslan-platform}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
      OIDC_DISCOVERY_ENABLED: ${OIDC_DISCOVERY_ENABLED:-true}
      OIDC_DISCOVERY_CACHE_SECONDS: ${OIDC_DISCOVERY_CACHE_SECONDS:-3600}
      OIDC_DISCOVERY_STALE_SECONDS: ${OIDC_DISCOVERY_STALE_SECONDS:-21600}
      OIDC_JWKS_STALE_SECONDS: ${OIDC_JWKS_STALE_SECONDS:-3600}
      OIDC_REFRESH_INTERVAL_SECONDS: ${OIDC_REFRESH_INTERVAL_SECONDS:-60}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-2592000}
      REFRESH_SESSION_PREFIX: ${REFRESH_SESSION_PREFIX:-aslan:refresh:session:}
      SESSION_MAINTENANCE_INTERVAL_SECONDS: ${SESSION_MAINTENANCE_INTERVAL_SECONDS:-300}
      SESSION_MAINTENANCE_LEASE_KEY: ${SESSION_MAINTENANCE_LEASE_KEY:-aslan:maintenance:session-index}
      SESSION_MAINTENANCE_FENCE_KEY: ${SESSION_MAINTENANCE_FENCE_KEY:-aslan:maintenance:session-index:fence}
      SESSION_MAINTENANCE_PROGRESS_KEY: ${SESSION_MAINTENANCE_PROGRESS_KEY:-aslan:maintenance:session-index:progress}
      SESSION_MAINTENANCE_JOURNAL_PREFIX: ${SESSION_MAINTENANCE_JOURNAL_PREFIX:-aslan:maintenance:journal}
      SESSION_MAINTENANCE_CLAIM_TTL_SECONDS: ${SESSION_MAINTENANCE_CLAIM_TTL_SECONDS:-120}
      SESSION_MAINTENANCE_COMPLETED_TTL_SECONDS: ${SESSION_MAINTENANCE_COMPLETED_TTL_SECONDS:-86400}
      SESSION_MAINTENANCE_QUARANTINE_TTL_SECONDS: ${SESSION_MAINTENANCE_QUARANTINE_TTL_SECONDS:-604800}
      SESSION_MAINTENANCE_QUARANTINE_AUDIT_TTL_SECONDS: ${SESSION_MAINTENANCE_QUARANTINE_AUDIT_TTL_SECONDS:-2592000}
      SESSION_MAINTENANCE_REMEDIATION_PREFIX: ${SESSION_MAINTENANCE_REMEDIATION_PREFIX:-aslan:maintenance:remediation}
      SESSION_MAINTENANCE_REMEDIATION_TTL_SECONDS: ${SESSION_MAINTENANCE_REMEDIATION_TTL_SECONDS:-2592000}
      SESSION_MAINTENANCE_APPROVAL_PREFIX: ${SESSION_MAINTENANCE_APPROVAL_PREFIX:-aslan:maintenance:approval}
      SESSION_MAINTENANCE_APPROVAL_TTL_SECONDS: ${SESSION_MAINTENANCE_APPROVAL_TTL_SECONDS:-1800}
      SESSION_MAINTENANCE_APPROVAL_SIGNING_SECRET: ${SESSION_MAINTENANCE_APPROVAL_SIGNING_SECRET:-change-this-approval-secret}
      SESSION_MAINTENANCE_QUORUM_PREFIX: ${SESSION_MAINTENANCE_QUORUM_PREFIX:-aslan:maintenance:quorum}
      SESSION_MAINTENANCE_QUORUM_EXECUTION_PREFIX: ${SESSION_MAINTENANCE_QUORUM_EXECUTION_PREFIX:-aslan:maintenance:quorum-execution}
      SESSION_MAINTENANCE_QUORUM_EXECUTION_TTL_SECONDS: ${SESSION_MAINTENANCE_QUORUM_EXECUTION_TTL_SECONDS:-2592000}
      SESSION_MAINTENANCE_QUORUM_EXECUTION_LEASE_SECONDS: ${SESSION_MAINTENANCE_QUORUM_EXECUTION_LEASE_SECONDS:-60}
      SESSION_MAINTENANCE_QUORUM_EXECUTION_HEARTBEAT_SECONDS: ${SESSION_MAINTENANCE_QUORUM_EXECUTION_HEARTBEAT_SECONDS:-15}
      IDEMPOTENCY_PREFIX: ${IDEMPOTENCY_PREFIX:-aslan:idempotency}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-2592000}
      COMPENSATION_PREFIX: ${COMPENSATION_PREFIX:-aslan:compensation}
      COMPENSATION_TTL_SECONDS: ${COMPENSATION_TTL_SECONDS:-2592000}
      COMPENSATION_MAX_ATTEMPTS: ${COMPENSATION_MAX_ATTEMPTS:-5}
      COMPENSATION_BASE_BACKOFF_SECONDS: ${COMPENSATION_BASE_BACKOFF_SECONDS:-30}
      COMPENSATION_WORKER_INTERVAL_SECONDS: ${COMPENSATION_WORKER_INTERVAL_SECONDS:-30}
      COMPENSATION_WORKER_BATCH_SIZE: ${COMPENSATION_WORKER_BATCH_SIZE:-50}
      COMPENSATION_EXECUTION_PREFIX: ${COMPENSATION_EXECUTION_PREFIX:-aslan:compensation-execution}
      COMPENSATION_EXECUTION_LEASE_SECONDS: ${COMPENSATION_EXECUTION_LEASE_SECONDS:-60}
      COMPENSATION_EXECUTION_TTL_SECONDS: ${COMPENSATION_EXECUTION_TTL_SECONDS:-2592000}
      COMPENSATION_EXECUTION_HEARTBEAT_SECONDS: ${COMPENSATION_EXECUTION_HEARTBEAT_SECONDS:-15}
      COMPENSATION_OUTBOX_PREFIX: ${COMPENSATION_OUTBOX_PREFIX:-aslan:compensation-outbox}
      COMPENSATION_OUTBOX_TTL_SECONDS: ${COMPENSATION_OUTBOX_TTL_SECONDS:-2592000}
      COMPENSATION_OUTBOX_DELIVERY_PREFIX: ${COMPENSATION_OUTBOX_DELIVERY_PREFIX:-aslan:compensation-outbox-delivery}
      COMPENSATION_OUTBOX_DELIVERY_LEASE_SECONDS: ${COMPENSATION_OUTBOX_DELIVERY_LEASE_SECONDS:-60}
      COMPENSATION_OUTBOX_DELIVERY_HEARTBEAT_SECONDS: ${COMPENSATION_OUTBOX_DELIVERY_HEARTBEAT_SECONDS:-15}
      DR_PREFIX: ${DR_PREFIX:-aslan:dr}
      DR_MAX_RPO_SECONDS: ${DR_MAX_RPO_SECONDS:-60}
      DR_MAX_RTO_SECONDS: ${DR_MAX_RTO_SECONDS:-300}
      ROLLING_UPGRADE_PREFIX: ${ROLLING_UPGRADE_PREFIX:-aslan:rolling-upgrade}
      SELF_HEALING_PREFIX: ${SELF_HEALING_PREFIX:-aslan:self-healing}
      SELF_HEALING_TTL_SECONDS: ${SELF_HEALING_TTL_SECONDS:-604800}
      SELF_HEALING_HEARTBEAT_TIMEOUT_SECONDS: ${SELF_HEALING_HEARTBEAT_TIMEOUT_SECONDS:-60}
      SELF_HEALING_QUARANTINE_SECONDS: ${SELF_HEALING_QUARANTINE_SECONDS:-300}
      SELF_HEALING_UNHEALTHY_SCORE: ${SELF_HEALING_UNHEALTHY_SCORE:-35}
      SELF_HEALING_DEGRADED_SCORE: ${SELF_HEALING_DEGRADED_SCORE:-65}
      SELF_HEALING_INTERVAL_SECONDS: ${SELF_HEALING_INTERVAL_SECONDS:-30}
      PRODUCTION_READINESS_STRICT: ${PRODUCTION_READINESS_STRICT:-true}
      BUILD_ID: ${BUILD_ID:-local-build}
      SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      SCHEMA_VERSION: ${SCHEMA_VERSION:-11.0}
      PROVIDER_TRUST_PREFIX: ${PROVIDER_TRUST_PREFIX:-aslan:provider-trust}
      PROVIDER_EVENT_TOLERANCE_SECONDS: ${PROVIDER_EVENT_TOLERANCE_SECONDS:-5}
      MODEL_REGISTRY_PREFIX: ${MODEL_REGISTRY_PREFIX:-aslan:model-registry}
      MODEL_DEPLOYMENT_PREFIX: ${MODEL_DEPLOYMENT_PREFIX:-aslan:model-deployment}
      MODEL_MONITORING_PREFIX: ${MODEL_MONITORING_PREFIX:-aslan:model-monitoring}
      FEATURE_STORE_PREFIX: ${FEATURE_STORE_PREFIX:-aslan:feature-store}
      FEATURE_STORE_OFFLINE_LIMIT: ${FEATURE_STORE_OFFLINE_LIMIT:-1000}
      PREDICTION_CACHE_PREFIX: ${PREDICTION_CACHE_PREFIX:-aslan:prediction-cache}
      PREDICTION_CACHE_TTL_SECONDS: ${PREDICTION_CACHE_TTL_SECONDS:-30}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-1.0}
      INFERENCE_MAX_BATCH_SIZE: ${INFERENCE_MAX_BATCH_SIZE:-16}
      STREAMING_ANALYTICS_PREFIX: ${STREAMING_ANALYTICS_PREFIX:-aslan:streaming}
      STREAMING_ANALYTICS_TTL_SECONDS: ${STREAMING_ANALYTICS_TTL_SECONDS:-86400}
      STREAMING_ALLOWED_LATENESS_SECONDS: ${STREAMING_ALLOWED_LATENESS_SECONDS:-10}
      STREAMING_DECISION_THRESHOLD: ${STREAMING_DECISION_THRESHOLD:-4.0}
      LIVE_DECISION_PREFIX: ${LIVE_DECISION_PREFIX:-aslan:live-decision}
      LIVE_DECISION_TTL_SECONDS: ${LIVE_DECISION_TTL_SECONDS:-604800}
      LIVE_DECISION_COOLDOWN_SECONDS: ${LIVE_DECISION_COOLDOWN_SECONDS:-30}
      LIVE_DECISION_MAX_ATTEMPTS: ${LIVE_DECISION_MAX_ATTEMPTS:-2}
      ALERTING_PREFIX: ${ALERTING_PREFIX:-aslan:alerting}
      ALERTING_TTL_SECONDS: ${ALERTING_TTL_SECONDS:-2592000}
      ALERTING_MAX_ATTEMPTS: ${ALERTING_MAX_ATTEMPTS:-3}
      ALERTING_BACKOFF_SECONDS: ${ALERTING_BACKOFF_SECONDS:-0.01}
      ALERT_POLICY_PREFIX: ${ALERT_POLICY_PREFIX:-aslan:alert-policy}
      ALERT_POLICY_TTL_SECONDS: ${ALERT_POLICY_TTL_SECONDS:-7776000}
      POSTMORTEM_PREFIX: ${POSTMORTEM_PREFIX:-aslan:postmortem}
      POSTMORTEM_TTL_SECONDS: ${POSTMORTEM_TTL_SECONDS:-31536000}
      RELIABILITY_PREFIX: ${RELIABILITY_PREFIX:-aslan:reliability}
      RELIABILITY_TTL_SECONDS: ${RELIABILITY_TTL_SECONDS:-31536000}
      RELEASE_GUARD_PREFIX: ${RELEASE_GUARD_PREFIX:-aslan:release-guard}
      RELEASE_GUARD_TTL_SECONDS: ${RELEASE_GUARD_TTL_SECONDS:-31536000}
      PROGRESSIVE_DELIVERY_PREFIX: ${PROGRESSIVE_DELIVERY_PREFIX:-aslan:progressive-delivery}
      PROGRESSIVE_DELIVERY_TTL_SECONDS: ${PROGRESSIVE_DELIVERY_TTL_SECONDS:-31536000}
      DEPLOYMENT_VERIFICATION_PREFIX: ${DEPLOYMENT_VERIFICATION_PREFIX:-aslan:deployment-verification}
      DEPLOYMENT_VERIFICATION_TTL_SECONDS: ${DEPLOYMENT_VERIFICATION_TTL_SECONDS:-31536000}
      DEPLOYMENT_SAFETY_PREFIX: ${DEPLOYMENT_SAFETY_PREFIX:-aslan:deployment-safety}
      DEPLOYMENT_SAFETY_TTL_SECONDS: ${DEPLOYMENT_SAFETY_TTL_SECONDS:-31536000}
      CHANGE_MANAGEMENT_PREFIX: ${CHANGE_MANAGEMENT_PREFIX:-aslan:change-management}
      CHANGE_MANAGEMENT_TTL_SECONDS: ${CHANGE_MANAGEMENT_TTL_SECONDS:-31536000}
      TRANSPARENCY_LOG_PREFIX: ${TRANSPARENCY_LOG_PREFIX:-aslan:transparency-log}
      TRANSPARENCY_LOG_TTL_SECONDS: ${TRANSPARENCY_LOG_TTL_SECONDS:-31536000}
      TRANSPARENCY_WITNESS_PREFIX: ${TRANSPARENCY_WITNESS_PREFIX:-aslan:transparency-witness}
      TRANSPARENCY_WITNESS_TTL_SECONDS: ${TRANSPARENCY_WITNESS_TTL_SECONDS:-31536000}
      GOVERNANCE_PREFIX: ${GOVERNANCE_PREFIX:-aslan:governance}
      GOVERNANCE_TTL_SECONDS: ${GOVERNANCE_TTL_SECONDS:-31536000}
      GOVERNANCE_EXCEPTION_PREFIX: ${GOVERNANCE_EXCEPTION_PREFIX:-aslan:governance-exceptions}
      GOVERNANCE_EXCEPTION_TTL_SECONDS: ${GOVERNANCE_EXCEPTION_TTL_SECONDS:-31536000}
      CONTINUOUS_COMPLIANCE_PREFIX: ${CONTINUOUS_COMPLIANCE_PREFIX:-aslan:continuous-compliance}
      CONTINUOUS_COMPLIANCE_TTL_SECONDS: ${CONTINUOUS_COMPLIANCE_TTL_SECONDS:-31536000}
      AUDIT_ORCHESTRATION_PREFIX: ${AUDIT_ORCHESTRATION_PREFIX:-aslan:audit-orchestration}
      AUDIT_ORCHESTRATION_TTL_SECONDS: ${AUDIT_ORCHESTRATION_TTL_SECONDS:-31536000}
      MVP_WORKSPACE_PREFIX: ${MVP_WORKSPACE_PREFIX:-aslan:mvp}
      MVP_WORKSPACE_TTL_SECONDS: ${MVP_WORKSPACE_TTL_SECONDS:-31536000}
      MVP_AUTH_PREFIX: ${MVP_AUTH_PREFIX:-aslan:mvp-auth}
      MVP_AUTH_TTL_SECONDS: ${MVP_AUTH_TTL_SECONDS:-86400}
      MVP_AUTH_SECRET: ${MVP_AUTH_SECRET:-local-pilot-secret-change-me}
      MVP_INTEGRATION_PREFIX: ${MVP_INTEGRATION_PREFIX:-aslan:mvp-integrations}
      MVP_INTEGRATION_TTL_SECONDS: ${MVP_INTEGRATION_TTL_SECONDS:-31536000}
      MATCH_INTELLIGENCE_PREFIX: ${MATCH_INTELLIGENCE_PREFIX:-aslan:match-intelligence}
      MATCH_INTELLIGENCE_TTL_SECONDS: ${MATCH_INTELLIGENCE_TTL_SECONDS:-31536000}
      PILOT_OBSERVABILITY_PREFIX: ${PILOT_OBSERVABILITY_PREFIX:-aslan:pilot-observability}
      PILOT_OBSERVABILITY_TTL_SECONDS: ${PILOT_OBSERVABILITY_TTL_SECONDS:-31536000}
      PILOT_PRODUCT_ANALYTICS_PREFIX: ${PILOT_PRODUCT_ANALYTICS_PREFIX:-aslan:pilot-product-analytics}
      PILOT_PRODUCT_ANALYTICS_TTL_SECONDS: ${PILOT_PRODUCT_ANALYTICS_TTL_SECONDS:-31536000}
      PILOT_EXPERIMENT_PREFIX: ${PILOT_EXPERIMENT_PREFIX:-aslan:pilot-experiments}
      PILOT_EXPERIMENT_TTL_SECONDS: ${PILOT_EXPERIMENT_TTL_SECONDS:-31536000}
      COMPLIANCE_ATTESTATION_PREFIX: ${COMPLIANCE_ATTESTATION_PREFIX:-aslan:compliance-attestation}
      COMPLIANCE_ATTESTATION_TTL_SECONDS: ${COMPLIANCE_ATTESTATION_TTL_SECONDS:-31536000}
      COMPLIANCE_ATTESTATION_KEY_ID: ${COMPLIANCE_ATTESTATION_KEY_ID:-local-v1}
      COMPLIANCE_ATTESTATION_SECRET: ${COMPLIANCE_ATTESTATION_SECRET:-change-me-in-production}
      COMPENSATION_OUTBOX_ORDERING_PREFIX: ${COMPENSATION_OUTBOX_ORDERING_PREFIX:-aslan:event-ordering}
      COMPENSATION_OUTBOX_ORDERING_TTL_SECONDS: ${COMPENSATION_OUTBOX_ORDERING_TTL_SECONDS:-2592000}
      COMPENSATION_OUTBOX_DELIVERY_TTL_SECONDS: ${COMPENSATION_OUTBOX_DELIVERY_TTL_SECONDS:-2592000}
      COMPENSATION_OUTBOX_MAX_ATTEMPTS: ${COMPENSATION_OUTBOX_MAX_ATTEMPTS:-5}
      COMPENSATION_OUTBOX_BASE_BACKOFF_SECONDS: ${COMPENSATION_OUTBOX_BASE_BACKOFF_SECONDS:-30}
      COMPENSATION_OUTBOX_WORKER_INTERVAL_SECONDS: ${COMPENSATION_OUTBOX_WORKER_INTERVAL_SECONDS:-10}
      COMPENSATION_OUTBOX_WORKER_BATCH_SIZE: ${COMPENSATION_OUTBOX_WORKER_BATCH_SIZE:-100}
      COMPENSATION_OUTBOX_TRANSPORT: ${COMPENSATION_OUTBOX_TRANSPORT:-logging}
      COMPENSATION_OUTBOX_WEBHOOK_URL: ${COMPENSATION_OUTBOX_WEBHOOK_URL:-}
      COMPENSATION_OUTBOX_WEBHOOK_TIMEOUT_SECONDS: ${COMPENSATION_OUTBOX_WEBHOOK_TIMEOUT_SECONDS:-5}
      COMPENSATION_OUTBOX_WEBHOOK_AUTHORIZATION: ${COMPENSATION_OUTBOX_WEBHOOK_AUTHORIZATION:-}
      COMPENSATION_OUTBOX_WEBHOOK_SIGNING_SECRET: ${COMPENSATION_OUTBOX_WEBHOOK_SIGNING_SECRET:-}
      COMPENSATION_OUTBOX_CIRCUIT_PREFIX: ${COMPENSATION_OUTBOX_CIRCUIT_PREFIX:-aslan:circuit-breaker}
      COMPENSATION_OUTBOX_CIRCUIT_FAILURE_THRESHOLD: ${COMPENSATION_OUTBOX_CIRCUIT_FAILURE_THRESHOLD:-5}
      COMPENSATION_OUTBOX_CIRCUIT_RECOVERY_SECONDS: ${COMPENSATION_OUTBOX_CIRCUIT_RECOVERY_SECONDS:-60}
      COMPENSATION_OUTBOX_RECEIPT_PREFIX: ${COMPENSATION_OUTBOX_RECEIPT_PREFIX:-aslan:compensation-outbox-receipt}
      COMPENSATION_OUTBOX_RECEIPT_TTL_SECONDS: ${COMPENSATION_OUTBOX_RECEIPT_TTL_SECONDS:-2592000}
      SESSION_MAINTENANCE_MAX_ATTEMPTS: ${SESSION_MAINTENANCE_MAX_ATTEMPTS:-3}
      SESSION_MAINTENANCE_MAX_INDEXES_PER_RUN: ${SESSION_MAINTENANCE_MAX_INDEXES_PER_RUN:-500}
      SESSION_MAINTENANCE_TIME_BUDGET_SECONDS: ${SESSION_MAINTENANCE_TIME_BUDGET_SECONDS:-20}
      SESSION_MAINTENANCE_SCAN_COUNT: ${SESSION_MAINTENANCE_SCAN_COUNT:-100}
      SESSION_MAINTENANCE_LEASE_TTL_SECONDS: ${SESSION_MAINTENANCE_LEASE_TTL_SECONDS:-120}
      SESSION_MAINTENANCE_LEASE_HEARTBEAT_SECONDS: ${SESSION_MAINTENANCE_LEASE_HEARTBEAT_SECONDS:-30}
      SESSION_MAINTENANCE_JITTER_SECONDS: ${SESSION_MAINTENANCE_JITTER_SECONDS:-15}
      SESSION_MAINTENANCE_ERROR_BACKOFF_SECONDS: ${SESSION_MAINTENANCE_ERROR_BACKOFF_SECONDS:-30}
      OIDC_ALLOWED_ISSUERS: ${OIDC_ALLOWED_ISSUERS:-}
      OIDC_CLAIM_MAPPING_JSON: ${OIDC_CLAIM_MAPPING_JSON:-}
      PROVIDER_API_KEYS: ${PROVIDER_API_KEYS:-}
      RATE_LIMIT_CAPACITY: 120
      RATE_LIMIT_REFILL_PER_SECOND: 2
      AUDIT_BACKEND: postgres
      MAX_REQUEST_BYTES: 1048576
      AUDIT_LOG_PATH: /data/audit.json
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://aslan:aslan@postgres:5432/aslan
      REDIS_URL: redis://redis:6379/0
      WORKER_INTERVAL_SECONDS: 2
      WORKER_ID: outbox-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  event-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://aslan:aslan@postgres:5432/aslan
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
      EVENT_STREAM: provider.events
      EVENT_CONSUMER_GROUP: api-bridge
      EVENT_CONSUMER_NAME: bridge-1
      PROVIDER_API_KEY_ID: ${PROVIDER_API_KEY_ID:-provider-1}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  sportmonks-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    environment:
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      SPORTMONKS_FIXTURE_IDS: ${SPORTMONKS_FIXTURE_IDS:-}
      SPORTMONKS_SYNC_INTERVAL_SECONDS: 30
      REDIS_URL: redis://redis:6379/0
      CHECKPOINT_PATH: /data/checkpoints.json
    volumes:
      - sync_data:/data
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["live"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aslan
      POSTGRES_USER: aslan
      POSTGRES_PASSWORD: aslan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aslan -d aslan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  sync_data:
  api_data:
